<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helbling Options — Exercise viewer</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header" id="app-header">
        <h1 id="header-title">Helbling Options</h1>
      </header>
      <main class="app-main" id="main"></main>
      <footer class="app-footer" id="app-footer" hidden>
        <div class="footer-exercise-bar">
          <div class="footer-exercise-center">
            <label class="hl-answers-toggle" title="Answer key mode">
              <input type="checkbox" id="toggle-answers" class="hl-answers-checkbox" />
              <span class="hl-answers-btn" aria-hidden="true">
                <span class="hl-answers-switch" aria-hidden="true">
                  <span class="hl-answers-knob" aria-hidden="true"></span>
                </span>
                <span class="hl-answers-btn-text">Answers</span>
              </span>
            </label>
            <button type="button" class="btn-footer-primary" id="btn-action" hidden>
              <span class="btn-action-icon" aria-hidden="true"></span>
              <span class="btn-action-label"></span>
            </button>
          </div>
          <button type="button" class="btn-footer-close" id="btn-close">
            <span class="btn-close-x" aria-hidden="true">✕</span>
            Close
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
