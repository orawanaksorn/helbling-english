<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helbling Options — Exercise viewer</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header" id="app-header">
        <h1 id="header-title">Helbling Options</h1>
      </header>
      <main class="app-main" id="main"></main>
      <footer class="app-footer" id="app-footer" hidden>
        <span class="footer-score" id="footer-score">Score: -/-</span>
        <button type="button" class="btn btn-primary" id="btn-answer">Answer</button>
        <button type="button" class="btn btn-primary" id="btn-show-all">Show all</button>
        <button type="button" class="btn btn-primary" id="btn-reset">Reset</button>
        <button type="button" class="btn btn-secondary" id="btn-close">Close</button>
      </footer>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
